<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colorful Scientific Calculator</title>
    <link rel="stylesheet" href="calculator.css">
</head>

<body>

<div class="background-shape shape1"></div>
<div class="background-shape shape2"></div>

<div class="calculator">

    <div class="header">
        <div>
            <h1>Scientific Calculator</h1>
            <p>Smart • Fast • Colorful</p>
        </div>

        <button id="modeBtn" class="mode-btn">DEG</button>
    </div>

    <div class="display-container">

        <div id="historyDisplay" class="history-display"></div>

        <input
            type="text"
            id="display"
            class="display"
            value="0"
            readonly
        >

    </div>

    <div class="scientific-buttons">

        <button class="scientific" data-value="sin(">sin</button>
        <button class="scientific" data-value="cos(">cos</button>
        <button class="scientific" data-value="tan(">tan</button>
        <button class="scientific" data-value="log(">log</button>
        <button class="scientific" data-value="ln(">ln</button>

        <button class="scientific" data-value="sqrt(">√</button>
        <button class="scientific" data-value="^2">x²</button>
        <button class="scientific" data-value="^">xʸ</button>
        <button class="scientific" data-value="!">x!</button>
        <button class="scientific" data-value="%">%</button>

        <button class="scientific" data-value="pi">π</button>
        <button class="scientific" data-value="e">e</button>
        <button class="scientific" data-value="(">(</button>
        <button class="scientific" data-value=")">)</button>
        <button class="scientific" id="ansBtn">ANS</button>

    </div>

    <div class="buttons">

        <button class="clear" id="clearBtn">AC</button>
        <button class="delete" id="deleteBtn">⌫</button>
        <button class="operator" data-value="/">÷</button>
        <button class="operator" data-value="*">×</button>

        <button data-value="7">7</button>
        <button data-value="8">8</button>
        <button data-value="9">9</button>
        <button class="operator" data-value="-">−</button>

        <button data-value="4">4</button>
        <button data-value="5">5</button>
        <button data-value="6">6</button>
        <button class="operator" data-value="+">+</button>

        <button data-value="1">1</button>
        <button data-value="2">2</button>
        <button data-value="3">3</button>
        <button class="equal" id="equalBtn">=</button>

        <button class="zero" data-value="0">0</button>
        <button data-value=".">.</button>

    </div>

    <div class="history-section">
        <div class="history-title">
            <span>Calculation History</span>
            <button id="clearHistory">Clear</button>
        </div>

        <div id="historyList"></div>
    </div>

</div>

<script src="calculator.js"></script>

</body>
</html>
